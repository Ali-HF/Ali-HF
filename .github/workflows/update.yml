name: Daily profile update

on:
  schedule:
    - cron: "0 3 * * *"   # 08:00 Karachi time
  workflow_dispatch:
  push:
    paths:
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyfiglet
      - name: Update README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "ali-hf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily profile refresh"
          git pull --rebase
          git push
