name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/enhance_snake.py"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=7ee787&color_dots=2d333b,1b4727,2ea043,3fb950,7ee787
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7ee787&color_dots=2d333b,1b4727,2ea043,3fb950,7ee787
      - name: Enhance snake with green gradient and greyish tiles
        run: python scripts/enhance_snake.py
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
