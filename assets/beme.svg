<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="230">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');
      .terminal-bg { fill: #0d0221; rx: 6px; stroke: #ff2a6d; stroke-width: 2px; }
      .header-bar { fill: #170936; }
      .window-btn-red { fill: #ff2a6d; }
      .window-btn-yellow { fill: #f9c80e; }
      .window-btn-cyan { fill: #05d9e8; }
      .window-title { font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 10px; fill: #05d9e8; letter-spacing: 1px; }
      .scanline {
        fill: none;
        stroke: rgba(5, 217, 232, 0.07);
        stroke-width: 1px;
      }
      .pixel-text {
        font-family: 'Press Start 2P', 'VT323', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
      .cursor {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #05d9e8;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineReveal {
        0% { opacity: 0; transform: translateX(-8px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .line-0 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 0.20s;
      }
      .line-1 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 0.60s;
      }
      .line-2 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.00s;
      }
      .line-3 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.40s;
      }
      .line-4 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.80s;
      }
      .line-5 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 2.20s;
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="2" y="2" width="776" height="226" class="terminal-bg"/>
  <rect x="2" y="2" width="776" height="28" class="header-bar" rx="6"/>
  <rect x="2" y="24" width="776" height="6" class="header-bar"/>

  <!-- Window Buttons -->
  <circle cx="20" cy="16" r="5" class="window-btn-red"/>
  <circle cx="36" cy="16" r="5" class="window-btn-yellow"/>
  <circle cx="52" cy="16" r="5" class="window-btn-cyan"/>

  <!-- Window Title -->
  <text x="390" y="19" text-anchor="middle" class="window-title">TERMINAL // >be_me.sh</text>

  <!-- CRT Scanlines -->
  <line x1="8" y1="35" x2="772" y2="35" class="scanline"/>
  <line x1="8" y1="39" x2="772" y2="39" class="scanline"/>
  <line x1="8" y1="43" x2="772" y2="43" class="scanline"/>
