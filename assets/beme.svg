<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="100%" height="230" shape-rendering="crispEdges">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 2px; }
      .header-bar { fill: #161b22; }
      .hud-pip { fill: #7ee787; }
      .hud-pip-dim { fill: #30363d; }
      .window-title { font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 10px; fill: #7ee787; letter-spacing: 1px; }
      .pixel-text {
        font-family: 'Press Start 2P', 'VT323', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
      .cursor {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #7ee787;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineReveal {
        0% { opacity: 0; transform: translateX(-8px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .line-0 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 0.20s;
      }
      .line-1 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 0.60s;
      }
      .line-2 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.00s;
      }
      .line-3 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.40s;
      }
      .line-4 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 1.80s;
      }
      .line-5 {
        opacity: 0;
        animation: lineReveal 0.4s ease forwards 2.20s;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="776" height="226" class="terminal-bg"/>
  <rect x="2" y="2" width="776" height="28" class="header-bar"/>
  <rect x="2" y="30" width="776" height="1" fill="#7ee787"/>

  <!-- Pips -->
  <rect x="16" y="10" width="8" height="8" class="hud-pip"/>
  <rect x="28" y="10" width="8" height="8" class="hud-pip-dim"/>
  <rect x="40" y="10" width="8" height="8" class="hud-pip-dim"/>

  <!-- Title -->
  <text x="390" y="19" text-anchor="middle" class="window-title">CAT_LOG // UNIT-01 // >be_me.sh</text>
  <g class="line-0">
    <text x="24" y="66" fill="#7ee787" class="pixel-text">>be me</text>
  </g>
  <g class="line-1">
    <text x="24" y="91" fill="#8b949e" class="pixel-text">>CS student in Karachi</text>
  </g>
  <g class="line-2">
    <text x="24" y="116" fill="#8b949e" class="pixel-text">>"just one more commit then sleep"</text>
  </g>
  <g class="line-3">
    <text x="24" y="141" fill="#7ee787" class="pixel-text">>it is 4am</text>
  </g>
  <g class="line-4">
    <text x="24" y="166" fill="#aff5b4" class="pixel-text">>the bug was a missing semicolon</text>
  </g>
  <g class="line-5">
    <text x="24" y="191" fill="#7ee787" class="pixel-text">>mfw (=^･ω･^=)</text>
  </g>
  <text x="210" y="191" class="cursor">█</text>
</svg>