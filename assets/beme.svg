  <g class="line-0">
    <text x="24" y="66" fill="#72f1b8" class="pixel-text">>be me</text>
  </g>
  <g class="line-1">
    <text x="24" y="91" fill="#72f1b8" class="pixel-text">>CS student in Karachi</text>
  </g>
  <g class="line-2">
    <text x="24" y="116" fill="#72f1b8" class="pixel-text">>"just one more commit then sleep"</text>
  </g>
  <g class="line-3">
    <text x="24" y="141" fill="#ff2a6d" class="pixel-text">>it is 4am</text>
  </g>
  <g class="line-4">
    <text x="24" y="166" fill="#f9c80e" class="pixel-text">>the bug was a missing semicolon</text>
  </g>
  <g class="line-5">
    <text x="24" y="191" fill="#05d9e8" class="pixel-text">>mfw</text>
  </g>
  <text x="80" y="191" class="cursor">█</text>
</svg>