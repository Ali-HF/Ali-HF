<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="370" shape-rendering="crispEdges">
  <defs>
    <style>
      .terminal-bg { fill: #0a0d0a; stroke: #263326; stroke-width: 2px; }
      .header-bar { fill: #141a14; }
      .hud-pip { fill: #00ff66; }
      .hud-pip-dim { fill: #384538; }
      .window-title { font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 10px; fill: #00ff66; letter-spacing: 1px; }
      .pixel-text {
        font-family: 'Press Start 2P', 'VT323', 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 0.3px;
      }
      .cursor {
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        fill: #00ff66;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineFade {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .item-0 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 0.20s;
      }
      .item-1 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 0.42s;
      }
      .item-2 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 0.64s;
      }
      .item-3 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 0.86s;
      }
      .item-4 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 1.08s;
      }
      .item-5 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 1.30s;
      }
      .item-6 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 1.52s;
      }
      .item-7 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 1.74s;
      }
      .item-8 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 1.96s;
      }
      .item-9 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 2.18s;
      }
      .item-10 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 2.40s;
      }
      .item-11 {
        opacity: 0;
        animation: lineFade 0.35s ease forwards 2.62s;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="776" height="366" class="terminal-bg"/>
  <rect x="2" y="2" width="776" height="28" class="header-bar"/>
  <rect x="2" y="30" width="776" height="1" fill="#00ff66"/>

  <!-- Pips -->
  <rect x="16" y="10" width="8" height="8" class="hud-pip"/>
  <rect x="28" y="10" width="8" height="8" class="hud-pip-dim"/>
  <rect x="40" y="10" width="8" height="8" class="hud-pip-dim"/>

  <!-- Title -->
  <text x="390" y="19" text-anchor="middle" class="window-title">BBS://MECHA-NET/SECTOR-KARACHI/31415926</text>
  <g class="item-0">
    <text x="24" y="58" fill="#829482" class="pixel-text">Anonymous 10/31/26(Sat)21:20:11 No.31415926</text>
  </g>
  <g class="item-1">
    <text x="36" y="78" fill="#00ff66" class="pixel-text">>ali pushed to main</text>
  </g>
  <g class="item-2">
    <text x="36" y="98" fill="#00ff66" class="pixel-text">>commit message: "fix"</text>
  </g>
  <g class="item-3">
    <text x="36" y="118" fill="#00ff66" class="pixel-text">>commit message: "fix2"</text>
  </g>
  <g class="item-4">
    <text x="36" y="138" fill="#00ff66" class="pixel-text">>commit message: "fix FINAL"</text>
  </g>
  <g class="item-5">
    <text x="36" y="158" fill="#00ff66" class="pixel-text">>commit message: "fix FINAL real"</text>
  </g>
  <g class="item-6">
    <text x="24" y="186" fill="#829482" class="pixel-text">Anonymous 10/31/26(Sat)21:20:48 No.31415927</text>
  </g>
  <g class="item-7">
    <text x="36" y="206" fill="#00ff66" class="pixel-text">>>31415926</text>
  </g>
  <g class="item-8">
    <text x="36" y="226" fill="#b8c9b8" class="pixel-text">it compiled once on his machine, that's all the QA we need</text>
  </g>
  <g class="item-9">
    <text x="24" y="254" fill="#829482" class="pixel-text">Anonymous 10/31/26(Sat)21:21:30 No.31415928</text>
  </g>
  <g class="item-10">
    <text x="36" y="274" fill="#00ff66" class="pixel-text">>>31415927</text>
  </g>
  <g class="item-11">
    <text x="36" y="294" fill="#b8c9b8" class="pixel-text">works on my machine is a valid deployment strategy</text>
  </g>
  <text x="590" y="294" class="cursor">█</text>
</svg>